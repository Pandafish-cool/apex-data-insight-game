<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX Data Insight · 你真的了解用户吗？</title>
<style>
html:root[data-theme="dark"]{--bg:#07080C;--bg2:#10121A;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.05);--ink:#F5F6FA;--ink2:#AEB3C2;--ink3:#6E7384;--a1:#9A8CFF;--a2:#45D8F7;--a3:#FF7D5E;--good:#46E0A8;--warn:#FFB547;--a1r:154,140,255;--a2r:69,216,247;--a3r:255,125,94;--goodr:70,224,168;--grad:linear-gradient(100deg,#B3A6FF 0%,#7EA8FF 48%,#45D8F7 100%);--ember:linear-gradient(100deg,#FFA27A,#FF6E7F);--on:#0B0C12;--shadow:0 30px 80px rgba(0,0,0,.45);--aur:.5;color-scheme:dark}
html:root[data-theme="light"]{--bg:#F5F5F8;--bg2:#FFFFFF;--card:rgba(255,255,255,.7);--card2:rgba(255,255,255,.92);--line:rgba(14,16,26,.1);--line2:rgba(14,16,26,.05);--ink:#0B0C12;--ink2:#4A4F5E;--ink3:#8B90A0;--a1:#5B45F0;--a2:#0A8FB5;--a3:#E0512F;--good:#0B9A68;--warn:#B47708;--a1r:91,69,240;--a2r:10,143,181;--a3r:224,81,47;--goodr:11,154,104;--grad:linear-gradient(100deg,#5B45F0 0%,#3366FF 50%,#0A8FB5 100%);--ember:linear-gradient(100deg,#E0512F,#D6336C);--on:#FFFFFF;--shadow:0 24px 60px rgba(20,24,40,.12);--aur:.35;color-scheme:light}
:root{--sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI Variable Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--text:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.aura{position:fixed;inset:-10%;z-index:0;pointer-events:none;filter:blur(90px) saturate(1.2);opacity:var(--aur)}
.aura i{position:absolute;border-radius:50%;transition:background 1.2s var(--ease)}
.aura i:nth-child(1){width:46vw;height:46vw;left:52%;top:-6%;background:rgba(var(--a1r),.6);animation:d1 26s ease-in-out infinite alternate}
.aura i:nth-child(2){width:38vw;height:38vw;left:2%;top:50%;background:rgba(var(--a2r),.4);animation:d2 32s ease-in-out infinite alternate}
.aura i:nth-child(3){width:30vw;height:30vw;left:34%;top:30%;background:rgba(80,110,255,.3);animation:d3 22s ease-in-out infinite alternate}
body[data-mood="gut"] .aura i:nth-child(1){background:rgba(var(--a3r),.5)}body[data-mood="gut"] .aura i:nth-child(2){background:rgba(255,170,90,.35)}
body[data-mood="win"] .aura i:nth-child(2){background:rgba(var(--goodr),.45)}
@keyframes d1{to{transform:translate(-14vw,10vh) scale(1.15)}}@keyframes d2{to{transform:translate(16vw,-12vh) scale(.9)}}@keyframes d3{to{transform:translate(10vw,14vh) scale(1.25)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
/* HUD */
.hud{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--grad);display:grid;place-items:center}
.brand i:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.0)}
.map{flex:1;display:flex;justify-content:center;gap:6px}
.map span{width:34px;height:6px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.map span.done{background:var(--grad)}
.map span.cur:after{content:"";position:absolute;inset:0;background:var(--grad);animation:load 1.6s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.score{font:700 14px var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);min-width:84px;text-align:center}
.score b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score.bump{animation:bump .6s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2)}
.tbtn:hover{border-color:rgba(var(--a1r),.5)}
/* layout */
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:32px 20px 60px;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center}
.scr{animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.st>*{animation:in .8s var(--ease) both}
.st>*:nth-child(2){animation-delay:.08s}.st>*:nth-child(3){animation-delay:.16s}.st>*:nth-child(4){animation-delay:.24s}.st>*:nth-child(5){animation-delay:.32s}.st>*:nth-child(6){animation-delay:.4s}
.kick{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;font:600 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin-bottom:18px}
.kick:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grad);animation:pulse 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
h1,h2,h3{font-family:var(--sans);margin:0;text-wrap:balance}
h1{font-size:clamp(40px,7vw,80px);line-height:1.02;font-weight:750;letter-spacing:-.045em}
h2{font-size:clamp(26px,4vw,40px);line-height:1.12;font-weight:700;letter-spacing:-.03em}
h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
:lang(zh-CN) h1,:lang(zh-CN) h2{letter-spacing:-.01em}
em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
em.w{background:var(--ember);-webkit-background-clip:text;background-clip:text}
.lead{font-size:clamp(16px,2vw,19px);line-height:1.6;color:var(--ink2);max-width:680px;margin:18px 0 0}
.sub{color:var(--ink2);font-size:15px;line-height:1.55;margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 26px;font:700 16px var(--text);background:var(--grad);color:var(--on);box-shadow:0 10px 30px rgba(var(--a1r),.35);transition:transform .35s var(--spring),box-shadow .3s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 40px rgba(var(--a1r),.45)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn .ar{transition:transform .3s var(--spring)}.btn:hover .ar{transform:translateX(4px)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font:500 11.5px var(--mono);color:var(--ink3);margin-top:14px;display:flex;gap:8px;align-items:flex-start}
.note:before{content:"";flex:none;width:14px;height:1px;background:var(--ink3);margin-top:8px}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* intro */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:38px 0 30px}
.lv{padding:18px;display:grid;gap:8px;transition:transform .4s var(--spring),border-color .3s}
.lv:hover{transform:translateY(-4px) rotate(-.6deg);border-color:rgba(var(--a1r),.45)}
.lv b{font:700 11px var(--mono);color:var(--a1)}
.lv h3{font-size:17px}
.lv p{margin:0;font-size:13px;color:var(--ink2);line-height:1.45}
.lv .ic{width:40px;height:40px;border-radius:12px;background:rgba(var(--a1r),.12);display:grid;place-items:center;margin-bottom:6px}
.lv svg{width:22px;height:22px;stroke:var(--a1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.role{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink2);transition:all .3s var(--spring)}
.role[aria-pressed="true"]{background:var(--grad);color:var(--on);border-color:transparent;transform:scale(1.04)}
/* level 1 */
.q{padding:30px}
.guess{margin-top:28px}
.gval{font:800 clamp(52px,9vw,88px)/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;background:var(--ember);-webkit-background-clip:text;background-clip:text;color:transparent}
.gval small{font-size:.4em;font-weight:600;color:var(--ink3);-webkit-text-fill-color:var(--ink3);margin-left:8px;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:10px;background:linear-gradient(90deg,rgba(var(--a3r),.7) var(--p,50%),var(--line) var(--p,50%));margin:22px 0 10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:3px solid var(--a3);box-shadow:0 6px 18px rgba(var(--a3r),.45);cursor:grab;transition:transform .2s}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2);cursor:grabbing}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:3px solid var(--a3)}
.scale{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--ink3)}
.rev{margin-top:26px;display:grid;gap:14px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:14px;align-items:center}
.bar span{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.bar .tr{height:16px;border-radius:10px;background:var(--line2);overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:10px;transition:width 1.2s var(--ease)}
.bar.you .tr i{background:var(--ember)}.bar.real .tr i{background:var(--grad);transition-delay:.35s}
.bar b{font:800 26px var(--sans);letter-spacing:-.04em;text-align:right;font-variant-numeric:tabular-nums}
.bar.real b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pts{display:inline-flex;align-items:center;gap:8px;font:800 20px var(--sans);padding:6px 14px;border-radius:999px;background:rgba(var(--goodr),.12);color:var(--good);animation:pop .7s var(--spring) both .9s}
.pts.lo{background:rgba(var(--a3r),.12);color:var(--a3)}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
.ins{padding:18px 20px;border-radius:16px;background:rgba(var(--a1r),.08);border:1px solid rgba(var(--a1r),.25);display:grid;gap:6px;animation:in .8s var(--ease) both 1.1s}
.ins b{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--a1)}
.ins p{margin:0;font-size:15.5px;line-height:1.55}
.ins p.did{color:var(--ink2);font-size:14px}
/* level 2 */
.l2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:22px;align-items:start}
.wf{position:relative;padding:0;overflow:hidden;min-height:380px;user-select:none}
.wf-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);font:700 14px var(--sans)}
.wf-top .dots{display:flex;gap:5px}.wf-top .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.wf-top .home{margin-left:auto;font:600 12px var(--text);color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:8px;background:none}
.wf-body{padding:18px}
.wfs-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wfs{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 10px;text-align:left;display:grid;gap:4px;transition:transform .3s var(--spring),border-color .3s,background .3s}
.wfs b{font:700 11px var(--mono);color:var(--ink3)}
.wfs span{font-size:13px;font-weight:600;line-height:1.3}
.wfs.ok{border-color:rgba(var(--goodr),.5)}
.wfs.err{border-color:rgba(var(--a3r),.7);background:rgba(var(--a3r),.1)}
.wfs.press{transform:scale(.94)}
.asking .wfs{cursor:pointer;animation:wig 2.4s ease-in-out infinite}
.asking .wfs:hover{border-color:var(--a1);transform:translateY(-3px)}
.asking .wfs:nth-child(2){animation-delay:.2s}.asking .wfs:nth-child(3){animation-delay:.4s}.asking .wfs:nth-child(4){animation-delay:.6s}
@keyframes wig{0%,90%,100%{rotate:0deg}93%{rotate:-2deg}96%{rotate:2deg}}
.wf-chart{margin-top:16px;height:150px;border-radius:12px;background:var(--line2);display:flex;align-items:flex-end;gap:10px;padding:16px}
.wf-chart i{flex:1;border-radius:6px 6px 2px 2px;background:rgba(var(--a1r),.35);height:var(--h);transition:height .6s var(--ease),opacity .4s}
.wf-chart.broken i{opacity:.25;height:12%!important}
.toast{position:absolute;right:16px;top:58px;padding:10px 14px;border-radius:12px;background:var(--a3);color:#fff;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(var(--a3r),.4);opacity:0;transform:translateY(-10px) scale(.95);transition:all .35s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:none}
.cursor{position:absolute;left:50%;top:70%;width:22px;height:22px;pointer-events:none;transition:left .7s var(--ease),top .7s var(--ease);z-index:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.cursor svg{width:22px;height:22px}
.cursor .rip{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;border:2px solid var(--a2);opacity:0}
.cursor.click .rip{animation:rip .5s ease-out}
@keyframes rip{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.gone{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s;text-align:center;padding:30px;z-index:4}
.gone.on{opacity:1}
.gone div{display:grid;gap:8px;justify-items:center}
.gone b{font:800 26px var(--sans);letter-spacing:-.03em}
.gone span{color:var(--ink2);font-size:14px}
.side{padding:22px;display:grid;gap:14px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font:500 12.5px var(--mono);color:var(--ink2);min-height:150px}
.log li{animation:in .4s var(--ease) both;display:flex;gap:8px}
.log li i{font-style:normal;color:var(--ink3)}
.log li.e{color:var(--a3)}.log li.x{color:var(--warn)}
.funnel{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.fr .tr{height:12px;border-radius:8px;background:var(--line2);overflow:hidden}
.fr .tr i{display:block;height:100%;width:0;border-radius:8px;background:var(--ink3);transition:width 1s var(--ease)}
.fr.hot .tr i{background:var(--ember)}
.fr b{font:700 13px var(--mono);text-align:right}.fr.hot b{color:var(--a3)}
/* level 3 */
.case{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.brief{padding:24px;display:grid;gap:12px;align-content:start}
.pot{display:flex;align-items:center;gap:12px}
.pot b{font:800 34px var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pot span{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clue{perspective:900px;height:132px;border:0;background:none;padding:0;text-align:left}
.clue .in{position:relative;width:100%;height:100%;transition:transform .8s var(--spring);transform-style:preserve-3d}
.clue.open .in{transform:rotateY(180deg)}
.clue .f,.clue .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px;display:grid;align-content:space-between;border:1px solid var(--line)}
.clue .f{background:linear-gradient(135deg,rgba(var(--a1r),.16),rgba(var(--a2r),.08));transition:transform .3s var(--spring)}
.clue:not(.open):hover .f{transform:translateY(-3px);border-color:rgba(var(--a1r),.5)}
.clue .f b{font:700 16px var(--sans)}
.clue .f span{font:600 11px var(--mono);color:var(--ink3)}
.clue .f .cost{color:var(--a3)}
.clue .b{transform:rotateY(180deg);background:var(--bg2);align-content:start;gap:6px}
.clue .b b{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--a1)}
.clue .b p{margin:0;font-size:13.5px;line-height:1.45}
.clue .b .tg{font:600 10px var(--mono);color:var(--ink3);margin-top:auto}
.clue .b .tg.real{color:var(--good)}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14.5px;line-height:1.45;font-weight:500;transition:transform .3s var(--spring),border-color .3s,background .3s}
.opt:hover{transform:translateX(4px);border-color:rgba(var(--a1r),.5)}
.opt i{font:700 12px var(--mono);font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--line2);color:var(--ink2)}
.opt.right{border-color:var(--good);background:rgba(var(--goodr),.1)}.opt.right i{background:var(--good);color:var(--on)}
.opt.wrong{border-color:var(--a3);background:rgba(var(--a3r),.08);opacity:.8}
.opts.done .opt{pointer-events:none}
.verdict{padding:18px 20px;border-radius:16px;display:grid;gap:8px;animation:in .7s var(--ease) both}
.verdict.g{background:rgba(var(--goodr),.1);border:1px solid rgba(var(--goodr),.35)}
.verdict.b{background:rgba(var(--a3r),.08);border:1px solid rgba(var(--a3r),.3)}
.verdict h3{font-size:18px}
.verdict p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.verdict .did{color:var(--ink);font-weight:600}
.verdict .did:before{content:"→ ";color:var(--a1)}
/* level 4 */
.req{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.rq{position:relative;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left;display:grid;gap:10px;align-content:start;min-height:180px;transition:transform .35s var(--spring),border-color .3s,background .3s,box-shadow .3s}
.rq:hover{transform:translateY(-3px)}
.rq[aria-pressed="true"]{border-color:transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;border:2px solid transparent;box-shadow:0 14px 40px rgba(var(--a1r),.25)}
.rq[aria-pressed="true"]:after{content:"✓";position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--on);font-size:13px;font-weight:800;animation:pop .4s var(--spring)}
.rq h3{font-size:16px;padding-right:26px}
.voice{display:flex;align-items:center;gap:8px;font:600 11.5px var(--mono);color:var(--warn)}
.voice .vb{display:flex;gap:2px;align-items:flex-end;height:14px}
.voice .vb i{width:3px;border-radius:2px;background:var(--warn);opacity:.25}
.voice .vb i.on{opacity:1;animation:eq 1s ease-in-out infinite alternate}
.voice .vb i:nth-child(2){animation-delay:.15s}.voice .vb i:nth-child(3){animation-delay:.3s}.voice .vb i:nth-child(4){animation-delay:.45s}.voice .vb i:nth-child(5){animation-delay:.6s}
@keyframes eq{to{transform:scaleY(.4)}}
.dat{display:grid;gap:6px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2);line-height:1.4;animation:in .6s var(--ease) both}
.meter{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font:600 10.5px var(--mono);color:var(--ink3)}

/* end */
.end{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center;margin-top:10px}

.ring .c span{font:600 12px var(--mono);color:var(--ink3);margin-top:6px}
.rank{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--a1)}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.part{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.part span{display:block;font:600 10.5px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.part b{font:800 22px var(--sans);letter-spacing:-.03em}
.part b small{font-size:12px;color:var(--ink3);font-weight:600}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:36px}

.les p{margin:0;font-size:14px;color:var(--ink2);line-height:1.5}

@media (max-width:820px){.levels,.parts{grid-template-columns:1fr 1fr}.l2,.case,.end,.why,.lessons{grid-template-columns:1fr}.req{grid-template-columns:1fr 1fr}.map{display:none}.bar{grid-template-columns:72px 1fr 64px}.ring{width:220px;height:220px}}

/* level 0: UX basics */
.scene{margin-top:4px;padding:22px 24px;display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:center}
.scene p{margin:0;font-size:clamp(16px,2vw,19px);line-height:1.6;color:var(--ink)}
.sic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(var(--a3r),.18),rgba(var(--a1r),.14));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-3deg)}}
.sic svg{width:32px;height:32px;fill:none;stroke:var(--a3);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}

.qopts.done .qopt{pointer-events:none}.qopts.done .qopt:not(.right):not(.wrong){opacity:.45}
.ahac{margin-top:22px;padding:26px 28px;display:grid;gap:12px;animation:in .7s var(--ease) both;scroll-margin-top:80px}
.ahah{display:flex;align-items:center;gap:12px}
.tag2{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--grad);color:var(--on)}
.ahac .big{font-size:clamp(24px,3.4vw,36px);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ahac .sub{margin:0}
.ahag{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.termc,.apexc{padding:16px 18px;border-radius:16px;display:grid;gap:6px;align-content:start}
.termc{background:rgba(var(--a1r),.08);border:1px solid rgba(var(--a1r),.25)}
.apexc{background:rgba(var(--a2r),.07);border:1px dashed rgba(var(--a2r),.35)}
.termc b,.apexc b{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--a1)}.apexc b{color:var(--a2)}
.termc h3{font-size:18px}.termc p,.apexc p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}.apexc p{color:var(--ink)}
@media (max-width:820px){.qopts,.ahag{grid-template-columns:1fr}.qopt{min-height:0}.scene{grid-template-columns:48px 1fr}.sic{width:48px;height:48px}}
/* ================= GAME SKIN: casual-game look (sticker cards, chunky 3D buttons, rounded type, sky world) ================= */
html:root[data-theme="light"]{--bg:#9EDBFF;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#FFF7E3;--line:#241E5C;--line2:rgba(36,30,92,.08);--ink:#241E5C;--ink2:#4D4789;--ink3:#8C87BD;--a1:#7C5CFF;--a2:#16AFFF;--a3:#FF5A5F;--good:#22C55E;--warn:#FFB020;--a1r:124,92,255;--a2r:22,175,255;--a3r:255,90,95;--goodr:34,197,94;--grad:linear-gradient(180deg,#FFD84D,#FFA51F);--ember:linear-gradient(180deg,#FF8A80,#FF4D6D);--on:#241E5C;--edge:#241E5C;--gold:#FFC83D;--road:#F6DFA9;--grass:#8EDB63;--skyT:#63C3FF;--skyB:#D9F4FF;--cloud:rgba(255,255,255,.95);--shadow:0 6px 0 var(--edge);color-scheme:light}
html:root[data-theme="dark"]{--bg:#1B1346;--bg2:#2C2174;--card:#2C2174;--card2:#382B8C;--line:#0C0828;--line2:rgba(255,255,255,.08);--ink:#FFFFFF;--ink2:#D6D0FF;--ink3:#A39BDF;--a1:#A98BFF;--a2:#3CC4FF;--a3:#FF6B6B;--good:#4ADE80;--warn:#FFC53D;--a1r:169,139,255;--a2r:60,196,255;--a3r:255,107,107;--goodr:74,222,128;--grad:linear-gradient(180deg,#FFD84D,#FFA51F);--ember:linear-gradient(180deg,#FF8A80,#FF4D6D);--on:#241E5C;--edge:#0C0828;--gold:#FFC83D;--road:#4A3D9A;--grass:#1F6B4E;--skyT:#140E3A;--skyB:#3A2384;--cloud:rgba(169,139,255,.22);--shadow:0 6px 0 var(--edge);color-scheme:dark}
:root{--sans:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--text:var(--sans);--mono:var(--sans)}
body{background:linear-gradient(180deg,var(--skyT),var(--skyB)) fixed}
:root[data-theme="dark"] body{background:radial-gradient(1.5px 1.5px at 10% 20%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff 50%,transparent),radial-gradient(2px 2px at 55% 15%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 80% 40%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 90% 80%,#fff 50%,transparent),radial-gradient(2px 2px at 70% 60%,#fffbe0 50%,transparent),linear-gradient(180deg,var(--skyT),var(--skyB)) fixed;background-size:420px 420px,380px 380px,520px 520px,460px 460px,400px 400px,600px 600px,100% 100%}
body:after{content:"";position:fixed;left:-20%;right:-20%;bottom:-120px;height:220px;border-radius:50% 50% 0 0;background:var(--grass);border-top:4px solid var(--edge);z-index:0;pointer-events:none}
.aura{filter:none;opacity:1;inset:0}
.aura i{border-radius:999px;background:var(--cloud)!important;height:56px!important;box-shadow:40px -22px 0 4px var(--cloud),90px -6px 0 -4px var(--cloud)}
.aura i:nth-child(1){width:150px!important;left:8%!important;top:16%!important;animation:cloud 60s linear infinite}
.aura i:nth-child(2){width:120px!important;left:62%!important;top:30%!important;animation:cloud 80s linear infinite -30s;transform:scale(.8)}
.aura i:nth-child(3){width:170px!important;left:40%!important;top:62%!important;animation:cloud 95s linear infinite -60s;opacity:.8}
@keyframes cloud{from{translate:-30vw 0}to{translate:110vw 0}}
h1,h2{font-weight:900;color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill;text-shadow:0 6px 0 var(--edge);letter-spacing:-.01em}
h2{-webkit-text-stroke:5px var(--edge);text-shadow:0 4px 0 var(--edge)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2{text-shadow:0 6px 0 var(--edge)}
em,em.w{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--gold);-webkit-text-fill-color:currentColor}
h3{font-weight:900}
.lead,.sub{color:var(--ink);font-weight:600}
main>.scr>.sub,main>.scr>.lead,main .st>.sub,main .st>.lead,main .scr>p.sub{background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--edge);display:inline-block;align-self:flex-start}

.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--edge)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge)}
.tbtn{border:2.5px solid var(--edge);background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--edge);border-radius:12px}

.hud{background:var(--card);border-bottom:3px solid var(--edge);backdrop-filter:none;-webkit-backdrop-filter:none}

.score{display:flex;align-items:center;gap:6px;border:2.5px solid var(--edge);background:var(--card2);box-shadow:0 3px 0 var(--edge);font-weight:900;border-radius:999px}

.map{gap:0;align-items:center}

.role{border:2.5px solid var(--edge);background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--edge)}

.mtag{background:var(--a3);color:#fff;border:2.5px solid var(--edge);font-weight:900}.mtag.q{background:var(--a2);color:#fff}
.mmeta{color:var(--ink2)!important;font-weight:800!important}
.mode h3{font-size:26px}
.mg{background:linear-gradient(180deg,#FFF7E3,#fff);border-color:var(--edge);box-shadow:0 8px 0 var(--edge);transform:rotate(-.6deg)}
:root[data-theme="dark"] .mg{background:var(--card2)}
.mprev{border:3px solid var(--edge);background:linear-gradient(180deg,var(--skyB) 0 55%,var(--grass) 55%)}

.mprev .sb:nth-of-type(3){border-top-color:var(--a3);background:var(--card)}
.mprev b{border:2.5px solid var(--edge);width:16px;height:16px;top:calc(55% - 9px)}
.mlv span{border:2px solid var(--edge);background:var(--card2)}
/* quiz bits */
.qopt,.opt,.rq,.wfs,.tool{border:3px solid var(--edge)!important;box-shadow:0 5px 0 var(--edge);background:var(--card)}
.qopt:hover,.opt:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--edge)}
.qopt i,.opt i{border:2px solid var(--edge);background:var(--card2);color:var(--ink)}

:root[data-theme="dark"] .qopt.right,:root[data-theme="dark"] .opt.right{background:#166534;color:#fff}:root[data-theme="dark"] .qopt.wrong,:root[data-theme="dark"] .opt.wrong{background:#7F1D1D;color:#fff}
.sic{border:3px solid var(--edge);background:var(--gold)}.sic svg{stroke:var(--edge);stroke-width:2.2}
.tag2{background:var(--gold);color:var(--on);border:2.5px solid var(--edge);font-weight:900}
.ahac .big{color:#fff}
.termc,.apexc{border:2.5px solid var(--edge)!important;background:var(--card2)}
.termc b,.apexc b{color:var(--a1)}

.tr{border:2px solid var(--edge)}

.bar.real b,.pot b,.ring .c b,.rvm .hl b{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--ink);-webkit-text-fill-color:currentColor}
.ring .c b{color:#fff;-webkit-text-stroke:6px var(--edge);paint-order:stroke fill;text-shadow:0 5px 0 var(--edge)}
.ring{background:var(--card);border:4px solid var(--edge);border-radius:50%;box-shadow:0 8px 0 var(--edge)}

.part{border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);background:var(--card)}

.coreq{margin:0;font-size:20px;font-weight:900;line-height:1.45;color:var(--ink)}
.cflow{display:grid;grid-template-columns:1fr 54px auto;align-items:center}
.cits{display:grid;gap:10px}
.cit{display:grid;gap:2px;padding:9px 12px;border-radius:14px;background:var(--card);border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);animation:in .6s var(--spring) both;animation-delay:calc(var(--k)*.15s + .3s)}
.cit b{font-size:15px;font-weight:900}.cit span{font-size:13px;font-weight:700;color:var(--ink2)}
.clines{width:100%;height:100%;min-height:150px}
.clines path{fill:none;stroke:var(--edge);stroke-width:2.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.cuser{display:grid;justify-items:center;gap:6px}
.cuser i{position:relative;width:84px;height:84px;border-radius:50%;background:var(--a2);border:3.5px solid var(--edge);box-shadow:0 5px 0 var(--edge),0 0 0 10px rgba(var(--a2r),.18);animation:hop 1.8s ease-in-out infinite}
.cuser i:before{content:"";position:absolute;left:21px;top:28px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:29px 0 0 #fff}
.cuser i:after{content:"";position:absolute;left:28px;top:48px;width:26px;height:12px;border:3.5px solid var(--edge);border-top:0;border-radius:0 0 26px 26px}
.cuser b{font-size:16px;font-weight:900;padding:3px 14px;border-radius:999px;background:var(--gold);border:2.5px solid var(--edge)}
.corep{margin:0;padding:10px 14px;border-radius:14px;background:var(--gold);border:2.5px solid var(--edge);font-weight:900;font-size:15px;color:var(--on)}
@media (max-width:520px){.cflow{grid-template-columns:1fr 36px auto}.cuser i{width:64px;height:64px}.cuser i:before{left:15px;top:21px;width:10px;height:10px;box-shadow:22px 0 0 #fff}.cuser i:after{left:20px;top:36px;width:20px;height:9px}}
.whys{margin:14px 0 0;font-size:15px;font-weight:700;color:var(--ink2);line-height:1.5}
.why ol{margin-top:14px!important}
.cuser .av{width:88px;height:88px;border-radius:50%;box-shadow:0 5px 0 var(--edge),0 0 0 10px rgba(var(--a2r),.18);animation:hop 1.8s ease-in-out infinite;overflow:hidden}
@media (max-width:520px){.cuser .av{width:66px;height:66px}}

/* membership CTA */
.mem{margin-top:30px;padding:26px;display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;background:linear-gradient(135deg,#FFF7E3,#fff 60%)}
:root[data-theme="dark"] .mem{background:var(--card2)}
.vip{position:relative;aspect-ratio:1.586;border-radius:18px;border:3.5px solid var(--edge);box-shadow:0 8px 0 var(--edge);overflow:hidden;padding:18px;display:grid;align-content:space-between;color:#3B2A00;background:linear-gradient(135deg,#FFE58A 0%,#FFC83D 45%,#F4A300 100%);transform:rotate(-4deg);transition:transform .5s var(--spring)}
.vip:hover,.vip.on{transform:rotate(0) scale(1.04)}
.vip .vt{font-size:11px;font-weight:900;letter-spacing:.14em}
.vip b{font-size:22px;font-weight:900;letter-spacing:-.01em}
.vip .vno{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.75}
.vip .vname{position:absolute;right:18px;bottom:18px;font-size:13px;font-weight:900}
.vchip{position:absolute;right:18px;top:18px;width:40px;height:30px;border-radius:7px;border:2.5px solid #7A5200;background:linear-gradient(135deg,#FFF3C4,#E0A800)}
.vip .shine{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.mtxt{display:grid;gap:10px;justify-items:start}
.mtg{font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--a3);color:#fff;border:2.5px solid var(--edge);animation:hop 1.4s ease-in-out infinite}
.mtxt h3{font-size:24px}
.mjoke{margin:0;font-size:16px;font-weight:800;line-height:1.5}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:700;color:var(--ink2)}
.perks li:before{content:"✓";flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--good);color:#fff;border:2px solid var(--edge)}
.fee{margin:2px 0 4px;font-size:13.5px;font-weight:900;color:var(--a1)}
.joined{margin:4px 0 0;padding:10px 14px;border-radius:14px;background:var(--good);color:#fff;border:2.5px solid var(--edge);font-weight:900;animation:popin .4s var(--spring)}
@keyframes popin{from{opacity:0;scale:.7}}
@media (max-width:820px){.mem{grid-template-columns:1fr}.vip{max-width:320px;justify-self:center}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

 <h2 style="margin-top:22px">${q.q}</h2>
 <div class="qopts" id="qo">${q.o.map((o,i)=>`<button class="qopt" data-o="${i}"><i>${'ABC'[i]}</i><span>${o}</span></button>`).join('')}</div><div id="aha"></div></section>`;
 app.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
  const box=document.getElementById('qo'); if(box.classList.contains('done')) return; box.classList.add('done');
  const i=+b.dataset.o, ok=i===q.a, first=!S.l0d[S.i]; S.l0d[S.i]=1; box.children[q.a].classList.add('right'); if(!ok) b.classList.add('wrong','shake');
  const p=ok?25:0; if(first&&p){add(p);S.parts[0]+=p;burst(...at(b),50)} mood(ok?'win':'data');
  document.getElementById('aha').innerHTML=`<div class="card ahac"><div class="ahah"><span class="tag2">${x.aha}</span>${ok?`<span class="pts" style="animation-delay:0s;font-size:15px">+${p} ${t().pts}</span>`:''}</div>
   <h2 class="big">${q.big}</h2><p class="sub" style="font-size:16px">${q.exp}</p>
   <div class="ahag"><div class="termc"><b>${x.term}</b><h3>${q.t[0]}</h3><p>${q.t[1]}</p></div><div class="apexc"><b>${x.apex}</b><p>${q.ap}</p></div></div></div>
   <div class="row" style="margin-top:16px"><button class="btn" id="nx">${S.i<x.qs.length-1?t().next:t().go} <span class="ar">→</span></button></div>`;
  document.getElementById('aha').scrollIntoView({behavior:'smooth',block:'start'});
  document.getElementById('nx').onclick=()=>{if(S.i<x.qs.length-1){S.i++;l0();chrome();window.scrollTo({top:0,behavior:'smooth'})} else {S.i=0;S.l2={phase:'watch',tries:0};go('l2')}};
 });
}
function count(el,n,D=1200,delay=0){setTimeout(()=>{const t0=performance.now();const tick=tt=>{const k=Math.min(1,(tt-t0)/D);el.textContent=Math.round(n*(1-Math.pow(2,-10*k)));if(k<1)requestAnimationFrame(tick);else el.textContent=n};requestAnimationFrame(tick)},delay)}
const CUR='<svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#0B0C12" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function l2(){
 mood('data'); const x=t().l2;
 app.innerHTML=`<section class="scr st"><div class="kick">${x.k}</div><h2>${x.h}</h2><p class="sub">${x.sub}</p>
 <div class="l2"><div class="card wf" id="wf"><div class="wf-top"><span class="dots"><i></i><i></i><i></i></span>${x.app}<button class="home" id="home" tabindex="-1">${x.home}</button></div>
  <div class="wf-body"><div class="wfs-row" id="steps">${x.steps.map((s,i)=>`<button class="wfs" data-s="${i}" disabled><b>0${i+1}</b><span>${s}</span></button>`).join('')}</div>
  <div class="wf-chart" id="chart">${[40,65,52,80,58,72,45].map(h=>`<i style="--h:${h}%"></i>`).join('')}</div></div>
  <div class="toast" id="toast">${x.err}</div><div class="cursor" id="cur">${CUR}<span class="rip"></span></div>
  <div class="gone" id="gone"><div><b>${x.gone}</b><span>${x.gone2}</span></div></div></div>
 <div class="card side"><h3 id="logh">${x.lockH}</h3><ul class="log" id="log"><li style="color:var(--ink3);font-family:var(--text);font-size:14px;line-height:1.5">${x.lockP}</li></ul><div class="row"><button class="btn" id="play">${x.play} <span class="ar">▶</span></button></div><div id="l2r"></div></div></div>
 <div class="note">${x.il}</div></section>`;
 document.getElementById('play').onclick=replay;
}
function replay(){
 const x=t().l2, wf=document.getElementById('wf'), cur=document.getElementById('cur'), gone=document.getElementById('gone'), btn=document.getElementById('play');
 const st=[...wf.querySelectorAll('.wfs')], home=document.getElementById('home'); btn.disabled=true; gone.classList.remove('on'); wf.classList.remove('asking'); st.forEach(s=>s.disabled=true);
 const pos=el=>{const a=wf.getBoundingClientRect(),b=el.getBoundingClientRect();return [b.left-a.left+b.width*.55,b.top-a.top+b.height*.6]};
 const move=el=>{const [l,tp]=pos(el);cur.style.left=l+'px';cur.style.top=tp+'px'};
 const click=i=>{cur.classList.remove('click');void cur.offsetWidth;cur.classList.add('click'); if(i!=null){st[i].classList.add('press');setTimeout(()=>st[i].classList.remove('press'),220)}};
 const seq=[[500,()=>move(st[0])],[800,()=>click(0)],[600,()=>move(st[1])],[800,()=>click(1)],[600,()=>move(st[2])],[800,()=>click(2)],[1100,()=>move(st[1])],[800,()=>click(1)],[700,()=>move(st[2])],[800,()=>click(2)],[600,()=>click(2)],[900,()=>move(st[3])],[1600,()=>move(home)],[800,()=>click()],[400,()=>gone.classList.add('on')],[1600,()=>{gone.classList.remove('on');ask()}]];
 let tt=0; seq.forEach(([d,f])=>{tt+=d;setTimeout(f,tt)});
}
function ask(){
 const x=t().l2, wf=document.getElementById('wf'), btn=document.getElementById('play'), r=document.getElementById('l2r');
 btn.disabled=false; btn.innerHTML=`${x.replay} <span class="ar">↺</span>`; btn.classList.add('ghost');
 if(S.l2.phase==='done') return;
 S.l2.phase='ask'; r.innerHTML=`<p class="sub" style="margin:0;color:var(--a1);font-weight:600">${x.ask}</p>`;
 wf.classList.add('asking');
 wf.querySelectorAll('.wfs').forEach(s=>{s.disabled=false;s.onclick=()=>{
  if(S.l2.phase!=='ask') return; S.l2.phase='done'; const ok=+s.dataset.s===2, p=ok?100:30;
  wf.classList.remove('asking'); wf.querySelectorAll('.wfs').forEach(z=>z.disabled=true);
  if(!ok){s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),500)}
  /* open the log: the data reveals the truth */
  const log=document.getElementById('log'); document.getElementById('logh').textContent=x.logH; log.innerHTML='';
  x.log.forEach((l,i)=>setTimeout(()=>{const li=document.createElement('li');li.className=/E-204/.test(l)?'e':i===8?'x':'';li.innerHTML=`<i>${String(i).padStart(2,'0')}</i>${l}`;log.appendChild(li)},i*170));
  setTimeout(()=>{const st=wf.querySelectorAll('.wfs'); st[0].classList.add('ok');st[1].classList.add('ok');st[2].classList.add('err');document.getElementById('chart').classList.add('broken');const to=document.getElementById('toast');to.classList.add('on');setTimeout(()=>to.classList.remove('on'),1800)},x.log.length*170);
  S.parts[2]=p; setTimeout(()=>{add(p); if(ok){burst(...at(s));mood('win')}},x.log.length*170);
  r.innerHTML=`<div class="verdict ${ok?'g':'b'}" style="animation-delay:${x.log.length*.17}s"><h3>${ok?x.right:x.wrong} <span class="pts ${ok?'':'lo'}" style="font-size:15px;animation-delay:${x.log.length*.17}s">+${p} ${t().pts}</span></h3>${ok?'':`<p>${x.wrongP}</p>`}
   <div class="funnel"><p class="sub" style="margin:0 0 4px;font-size:12px">${x.fun}</p>${x.steps.map((n,i)=>`<div class="fr ${i===2?'hot':''}"><span>${n}</span><div class="tr"><i data-w="${x.funV[i]/35*100}"></i></div><b>${x.funV[i]}%</b></div>`).join('')}</div>
   <p>${x.saw}</p><p class="did">${x.did}</p></div><div class="row" style="margin-top:14px"><button class="btn" id="nx">${t().go} <span class="ar">→</span></button></div>`;
  setTimeout(()=>r.querySelectorAll('.fr i').forEach(i=>i.style.width=i.dataset.w+'%'),x.log.length*170+200);
  document.getElementById('nx').onclick=()=>{S.i=0;S.l3={open:[],done:false};go('l3')};
 }});
}
function l3(){
 const x=t().l3, c=x.cases[S.i], o=S.l3.open; mood(o.length?'data':'gut');
 const pot=100-o.length*15;
 app.innerHTML=`<section class="scr st"><div class="kick">${x.k}</div><h2>${c.t}</h2><p class="sub">${c.b}</p>
 <div class="case"><div class="card brief"><div class="pot"><b id="pot">${pot}</b><span>${x.pot}</span></div><h3>${x.clueH}</h3>
  <div class="clues">${c.clues.map((k,i)=>`<button class="clue ${o.includes(i)?'open':''}" data-c="${i}" aria-label="${k[0]}"><div class="in"><div class="f"><span>0${i+1}</span><b>${k[0]}</b><span class="cost">${x.cost}</span></div><div class="b"><b>${k[0]}</b><p>${k[1]}</p><span class="tg ${k[2]==='real'?'real':''}">${k[2]==='real'?x.real:x.ill}</span></div></div></button>`).join('')}</div></div>
 <div class="card brief"><h3>${x.optH}</h3><div class="opts" id="opts">${c.opts.map((p,i)=>`<button class="opt" data-o="${i}"><i>${'ABC'[i]}</i><span>${p}</span></button>`).join('')}</div><div id="vd"></div></div></div></section>`;
 app.querySelectorAll('.clue').forEach(b=>b.onclick=()=>{const i=+b.dataset.c; if(S.l3.done||o.includes(i)) return; o.push(i); b.classList.add('open'); mood('data'); const pe=document.getElementById('pot'); pe.textContent=100-o.length*15});
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(S.l3.done) return; S.l3.done=true; const i=+b.dataset.o, ok=i===c.a, p=ok?Math.max(40,100-o.length*15):0;
  const box=document.getElementById('opts'); box.classList.add('done'); box.children[c.a].classList.add('right'); if(!ok) b.classList.add('wrong','shake');
  if(ok&&o.length===0) S.gut++;
  if(ok){add(p);S.parts[3]+=p;burst(...at(b));mood('win')} else mood('gut');
  document.getElementById('vd').innerHTML=`<div class="verdict ${ok?'g':'b'}" style="margin-top:14px"><h3>${ok?x.ok:x.bad} ${ok?`<span class="pts" style="font-size:15px;animation-delay:0s">+${p} ${t().pts}</span>`:''} ${ok&&o.length===0?`<span class="tag" style="font:600 11px var(--mono);color:var(--warn)">${x.gutTag}</span>`:''}</h3><p>${c.why[i]}</p>${ok?'':`<p>${c.why[c.a]}</p>`}<p class="did">${c.did}</p></div><div class="row" style="margin-top:14px"><button class="btn" id="nx">${S.i<2?t().next:t().go} <span class="ar">→</span></button></div>`;
  document.getElementById('nx').onclick=()=>{S.l3={open:[],done:false}; if(S.i<2){S.i++;l3();chrome();window.scrollTo({top:0,behavior:'smooth'})} else {S.l4={phase:1,pick:[],first:[]};go('l4')}};
 });
}
function l4(){
 const x=t().l4, L=S.l4; mood(L.phase===1?'gut':'data');
 const vb=n=>`<span class="vb">${[1,2,3,4,5].map(k=>`<i class="${k<=n?'on':''}" style="height:${4+k*2}px"></i>`).join('')}</span>`;
 app.innerHTML=`<section class="scr st"><div class="kick">${x.k}</div><h2>${x.h}</h2><p class="sub">${L.phase===1?x.p1:L.phase===2?x.p2:''}</p>
 <div class="req" id="req">${x.reqs.map((r,i)=>`<button class="rq ${L.phase===3&&x.bestIdx.includes(i)?'best':''}" data-q="${i}" aria-pressed="${L.pick.includes(i)}"><h3>${r[0]}</h3><div class="voice">${vb(r[1])}${x.voiceL} ${r[1]} ${x.times}</div>${L.phase>=2?`<div class="dat"><div class="meter u"><span>${x.use}</span><div class="tr"><i data-w="${r[2]}"></i></div></div><div class="meter f"><span>${x.fric}</span><div class="tr"><i data-w="${r[3]}"></i></div></div><span>${r[4]}</span>${L.phase===3&&x.bestIdx.includes(i)?`<span class="badge">${x.best}</span>`:''}</div>`:''}</button>`).join('')}</div>
 <div class="phase" id="ph"></div><div id="l4r"></div><div class="note">${x.il}</div></section>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.meter i').forEach(i=>i.style.width=i.dataset.w+'%')));
 const ph=document.getElementById('ph');
 const bar=()=>{ if(L.phase===3) return; ph.innerHTML=`<span class="sel">${x.sel} ${L.pick.length}/2</span><button class="btn" id="lk" ${L.pick.length===2?'':'disabled'}>${L.phase===1?x.lock1:x.lock2} <span class="ar">→</span></button>`;
  document.getElementById('lk').onclick=()=>{ if(L.phase===1){L.first=[...L.pick];L.phase=2;l4()} else finish4()}};
 bar();
 if(L.phase<3) app.querySelectorAll('.rq').forEach(b=>b.onclick=()=>{const i=+b.dataset.q, k=L.pick.indexOf(i);
  if(k>=0) L.pick.splice(k,1); else {if(L.pick.length>=2) L.pick.shift(); L.pick.push(i)}
  app.querySelectorAll('.rq').forEach(z=>z.setAttribute('aria-pressed',L.pick.includes(+z.dataset.q))); bar()});
 if(L.phase===3) result4();
}
function finish4(){
 const x=t().l4, L=S.l4; const hit=L.pick.filter(i=>x.bestIdx.includes(i)).length; const p=hit*100; S.parts[4]=p; L.phase=3; L.p=p; l4(); add(p);
 if(p===200) setTimeout(()=>burst(innerWidth/2,innerHeight/2,120),300);
}
function result4(){
 const x=t().l4, L=S.l4; const f=L.first.filter(i=>x.bestIdx.includes(i)).length;
 document.getElementById('l4r').innerHTML=`<div class="verdict ${L.p>=100?'g':'b'}" style="margin-top:18px"><h3>${x.res} <span class="pts ${L.p?'':'lo'}" style="font-size:15px;animation-delay:0s">+${L.p} ${t().pts}</span></h3><p>${x.resP}</p><p style="font:600 12px var(--mono);color:var(--ink3)">${lang==='cn'?`凭声音：命中 ${f}/2 · 看数据后：命中 ${L.p/100}/2`:`By voice: ${f}/2 · With data: ${L.p/100}/2`}</p></div><div class="row" style="margin-top:14px"><button class="btn" id="nx">${t().go} <span class="ar">→</span></button></div>`;
 document.getElementById('nx').onclick=()=>go('end');
}
function end(){
 mood('win'); const x=t().end, pct=Math.round(S.score/800*100), rk=x.ranks.find(r=>pct>=r[0]); const mx=[200,100,300,200], PI=[0,2,3,4];
 app.innerHTML=`<section class="scr st"><div class="kick">${x.k}</div>
 <div class="end"><div class="ring"><svg viewBox="0 0 240 240"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs><circle class="bgc" cx="120" cy="120" r="110"/><circle class="fgc" id="fgc" cx="120" cy="120" r="110"/></svg><div class="c"><b id="fs">0</b><span>${x.of}</span></div></div>
  <div><h2>${x.h}</h2><p class="rank" style="margin:14px 0 4px">${rk[1]}</p><p class="sub" style="margin:0">${rk[2]}</p>
  <div class="parts">${x.parts.map((n,i)=>`<div class="part"><span>${n}</span><b>${S.parts[PI[i]]}<small> / ${mx[i]}</small></b></div>`).join('')}</div>
  <p class="sub" style="font-size:13px">${x.gut}: ${S.gut} ${x.gutN}</p><div class="ins" style="margin-top:14px;animation-delay:.6s"><b>${x.tipH} · ${t().intro.roles[S.role]}</b><p>${x.tips[S.role]}</p></div></div></div>
 <h3 style="margin-top:44px">${x.lesH}</h3><div class="lessons" style="margin-top:14px">${x.les.map(l=>`<div class="card les"><b>${l[0]}</b><h3>${l[1]}</h3><p>${l[2]}</p></div>`).join('')}</div>
 <div class="card why"><div><h2>${x.whyH}</h2><p class="whys">${x.whyS}</p><ol style="margin-top:20px">${x.why.map((w,i)=>`<li><i>${i+1}</i><div><b>${w[0]}</b><span>${w[1]}</span></div></li>`).join('')}</ol></div>
  <div class="core"><b class="coreh">${x.core.h}</b><p class="coreq">${x.core.q}</p><div class="cflow"><div class="cits">${x.core.it.map((c,i)=>`<div class="cit" style="--k:${i}"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div><svg class="clines" viewBox="0 0 60 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C30 30 30 90 60 90M0 90 H60M0 150 C30 150 30 90 60 90"/></svg><div class="cuser"><svg class="av" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" fill="var(--card)" stroke="var(--edge)" stroke-width="3.5"/><path d="M14 78c3-15 14-23 28-23s25 8 28 23" fill="var(--a1)" stroke="var(--edge)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="42" cy="34" r="17" fill="var(--gold)" stroke="var(--edge)" stroke-width="3.5"/><circle cx="35.5" cy="33" r="2.4" fill="var(--edge)"/><circle cx="48.5" cy="33" r="2.4" fill="var(--edge)"/><circle cx="31" cy="39" r="3" fill="#FF8FA3" opacity=".7"/><circle cx="53" cy="39" r="3" fill="#FF8FA3" opacity=".7"/><path d="M37 40q5 4.5 10 0" fill="none" stroke="var(--edge)" stroke-width="2.6" stroke-linecap="round"/></svg><b>${x.core.u}</b></div></div><p class="corep">${x.core.p}</p></div></div>
 <div class="card mem"><div class="vip" aria-hidden="true"><span class="vchip"></span><span class="vt">VIP · USER INSIGHT</span><b>APEX Data Insight</b><span class="vno">${x.mem.no} 0001</span><span class="vname">${x.mem.you}</span><i class="shine"></i></div><div class="mtxt"><span class="mtg">${x.mem.tag}</span><h3>${x.mem.h}</h3><p class="mjoke">${x.mem.joke}</p><ul class="perks">${x.mem.perks.map(k=>`<li>${k}</li>`).join('')}</ul><p class="fee">${x.mem.fee}</p><button class="btn" id="join">${x.mem.join} <span class="ar">★</span></button></div></div><div class="row" style="margin-top:22px;justify-content:flex-end"><button class="btn ghost" id="again">${x.again} <span class="ar">↺</span></button></div>
 <div class="note">${x.src}</div></section>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=document.getElementById('fgc'); if(f) f.style.strokeDashoffset=691*(1-S.score/800)}));
 count(document.getElementById('fs'),S.score,1800,300);
 if(pct>=55) setTimeout(()=>burst(innerWidth/2,innerHeight*.35,140),900);
 document.getElementById('again').onclick=()=>{reset();go('intro')};
 document.getElementById('join').onclick=e=>{const b=e.currentTarget; burst(...at(b),120); b.outerHTML=`<p class="joined">${x.mem.joined}</p>`; const v=document.querySelector('.vip'); if(v) v.classList.add('on')};
}
/* ---------- controls ---------- */
document.getElementById('lang').onclick=()=>{lang=lang==='cn'?'en':'cn';store.set('adi_lang',lang);render()};
document.getElementById('theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';store.set('adi_theme',d.dataset.theme);chrome()};
render();
</script>
</body>
</html>
